# Example CI for terraform-mcp-azure. Copy to .github/workflows/terraform-mcp-azure.yml in your repository.
# Jobs: unit tests (no Azure needed), storage-semantics tests against Azurite, terraform fmt/validate of
# every template, PowerShell parse + execution of the deploy script against a fake az CLI, image build.
name: terraform-mcp-azure

on:
  pull_request:
    paths: ["terraform-mcp-azure/**"]
  push:
    branches: [main]
    paths: ["terraform-mcp-azure/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform-mcp-azure

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - name: Templates and policies match the reviewed integrity manifest
        run: cd server && python -m tfmcp.integrity verify
      - name: Unit tests (security controls, token budgets, policy, cost, durability, both HTTP channels)
        run: cd server && python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Storage semantics against Azurite (ETag compare-and-swap, lease break)
        run: ci/run-azurite-tests.sh

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform fmt + validate for every template
        run: ci/validate-templates.sh

  deploy-script:
    runs-on: ubuntu-latest          # pwsh is preinstalled on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Parse-check all scripts and run the deploy script against the fake az CLI
        run: ci/test-deploy-script.sh
      - name: Run the installer (wizard, unattended, preflight, resume, uninstall) against fake az + pac
        run: ci/test-installer.sh

  image:
    runs-on: ubuntu-latest
    needs: [unit-tests, templates]
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image (verifies the pinned Terraform / provider checksums)
        run: docker build -t azure-terraform-mcp:ci server
      - name: The image starts and serves /healthz
        run: |
          docker run -d --name mcp -p 8080:8080 -e SUBSCRIPTION_ID=11111111-1111-1111-1111-111111111111 \
            -e WORKLOAD_RG=rg-ci -e STATE_SA=stci -e AUTH_MODE=none -e RBAC=off -e STORE_MODE=memory azure-terraform-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1
