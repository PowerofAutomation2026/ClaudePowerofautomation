<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Illustration: Entra app registration, Authentication, Web redirect URIs (sample values)">
<style>text{font-family:Segoe UI,Arial,sans-serif}</style>
<rect width="900" height="360" rx="12" fill="#1f1f1f"/>
<text x="24" y="38" font-size="16" fill="#fff" font-weight="700">SharePointExplorer-CopilotStudio | Authentication</text>
<text x="24" y="60" font-size="11" fill="#9aa4b2">Entra admin center → App registrations → your app → Authentication</text>
<rect x="24" y="78" width="852" height="34" rx="6" fill="#2b2b2b"/>
<text x="40" y="100" font-size="12" fill="#fff">Platform configuration:  <tspan font-weight="700">Web</tspan></text>
<g font-size="12" fill="#e8e8e8">
<rect x="24" y="120" width="852" height="44" rx="6" fill="#262626" stroke="#3a3a3a"/>
<text x="40" y="140" fill="#9aa4b2" font-size="10">Redirect URI 1 — generic (keep)</text>
<text x="40" y="156">https://global.consent.azure-apim.net/redirect</text>
<rect x="24" y="172" width="852" height="44" rx="6" fill="#262626" stroke="#4aa3ff"/>
<text x="40" y="192" fill="#4aa3ff" font-size="10">Redirect URI 2 — per connector (required; copy it from the connector's Security tab or the AADSTS50011 error)</text>
<text x="40" y="208">https://global.consent.azure-apim.net/redirect/new-5fcontoso-20copilot-20direct-5f0123456789abcdef</text>
</g>
<rect x="24" y="232" width="110" height="30" rx="6" fill="#0f6cbd"/><text x="52" y="252" font-size="12" fill="#fff" font-weight="700">Save</text>
<g font-size="11" fill="#cfd6e0">
<text x="24" y="296">✔ exact text · case-sensitive · no quotes · no trailing slash or space</text>
<text x="24" y="316">✔ platform type must be <tspan font-weight="700">Web</tspan> (not Single-page application)</text>
<text x="24" y="336">✔ the app named in the error message (Application / client ID) must be THIS app</text>
</g>
</svg>
