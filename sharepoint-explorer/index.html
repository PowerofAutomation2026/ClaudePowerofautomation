<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SharePoint Explorer</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var p = JSON.parse(localStorage.getItem('spx.theme') || '"system"');
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = p === 'system' ? (dark ? 'dark' : 'light') : p;
        var s = JSON.parse(localStorage.getItem('spx.fs') || '16'); document.documentElement.style.fontSize = s + 'px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
