<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Dashboard</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--accent:#2563eb;--border:#e4e7ec}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f27;--text:#e8ebf0;--muted:#98a2b3;--accent:#6ea0ff;--border:#2a313c}}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  .muted{color:var(--muted);font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  input,button,select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
  .kpi{font-size:24px;font-weight:600}
  canvas{width:100%;height:220px;display:block}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  .scroll{overflow:auto;max-height:260px}
  #err{color:#d92d20;margin:8px 0}
</style>
</head>
<body>
<h1 id="title">File Dashboard</h1>
<div class="muted" id="status">Load a CSV to begin.</div>
<div class="bar">
  <input type="file" id="file" accept=".csv">
  <input type="text" id="url" placeholder="CSV URL (optional, auto-refreshes)" size="40">
  <select id="every"><option value="0">No refresh</option><option value="30">30 s</option><option value="60" selected>1 min</option><option value="300">5 min</option></select>
  <button id="go">Load URL</button>
</div>
<div id="err"></div>
<div id="out"></div>
<script>
let timer=null, lastText=null;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()!==''));
}
const isNum=v=>v!==''&&!isNaN(Number(v));
const isDate=v=>/^\d{4}-\d{2}-\d{2}/.test(v)&&!isNaN(Date.parse(v));

function analyze(rows){
  const head=rows[0].map(h=>h.trim()),data=rows.slice(1);
  const cols=head.map((name,i)=>{
    const vals=data.map(r=>(r[i]??'').trim()),non=vals.filter(v=>v!=='');
    let type='text';
    if(non.length&&non.every(isNum))type='number';
    else if(non.length&&non.every(isDate))type='date';
    return{name,i,type,vals,blank:vals.length-non.length};
  });
  return{head,data,cols};
}
const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});

function bars(cv,labels,vals){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const max=Math.max(...vals,1),pad=24,bw=(w-pad)/labels.length;
  g.font='11px system-ui';g.textAlign='center';
  labels.forEach((l,i)=>{
    const bh=(h-pad-16)*vals[i]/max,x=pad+i*bw+bw*0.15;
    g.fillStyle=css('--accent');g.fillRect(x,h-pad-bh,bw*0.7,bh);
    g.fillStyle=css('--muted');g.fillText(String(l).slice(0,10),x+bw*0.35,h-8);
    g.fillStyle=css('--text');g.fillText(fmt(vals[i]),x+bw*0.35,h-pad-bh-4);
  });
}
function line(cv,labels,vals){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const max=Math.max(...vals,1),min=Math.min(...vals,0),p=24,n=vals.length;
  const X=i=>p+(n<2?0:i*(w-2*p)/(n-1)),Y=v=>h-p-(v-min)/(max-min||1)*(h-2*p);
  g.strokeStyle=css('--accent');g.lineWidth=2;g.beginPath();
  vals.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  g.fillStyle=css('--accent');vals.forEach((v,i)=>{g.beginPath();g.arc(X(i),Y(v),3,0,7);g.fill()});
  g.fillStyle=css('--muted');g.font='11px system-ui';g.textAlign='left';
  g.fillText(labels[0],p,h-6);g.textAlign='right';g.fillText(labels[n-1],w-p,h-6);
}

function render(text,name){
  $('err').textContent='';
  let rows;
  try{rows=parseCSV(text)}catch(e){$('err').textContent='Could not parse file.';return}
  if(rows.length<2){$('err').textContent='File has no data rows.';$('out').innerHTML='';return}
  const{head,data,cols}=analyze(rows);
  $('title').textContent=name||'File Dashboard';
  $('status').textContent=`${data.length} rows, ${head.length} columns. Updated ${new Date().toLocaleTimeString()}`;
  const nums=cols.filter(c=>c.type=='number'),texts=cols.filter(c=>c.type=='text'),dates=cols.filter(c=>c.type=='date');
  let h='<div class="grid">';
  h+=`<div class="card"><div class="muted">Rows</div><div class="kpi">${fmt(data.length)}</div></div>`;
  nums.slice(0,4).forEach(c=>{
    const v=c.vals.filter(isNum).map(Number),s=v.reduce((a,b)=>a+b,0);
    h+=`<div class="card"><div class="muted">${c.name} (total / avg)</div><div class="kpi">${fmt(s)}</div><div class="muted">avg ${fmt(s/v.length)}${c.blank?`, ${c.blank} blank`:''}</div></div>`;
  });
  h+='</div><div class="grid" style="margin-top:12px">';
  const m=nums[0],cat=texts.find(c=>new Set(c.vals).size>1&&new Set(c.vals).size<=12);
  if(m&&cat){h+=`<div class="card"><div class="muted">${m.name} by ${cat.name}</div><canvas id="c1"></canvas></div>`}
  if(m&&dates[0]){h+=`<div class="card"><div class="muted">${m.name} over ${dates[0].name}</div><canvas id="c2"></canvas></div>`}
  h+='</div>';
  const blanks=cols.filter(c=>c.blank);
  if(blanks.length)h+=`<p class="muted">Blank values: ${blanks.map(c=>c.name+' ('+c.blank+')').join(', ')}</p>`;
  h+=`<div class="card" style="margin-top:12px"><div class="scroll"><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${data.slice(0,200).map(r=>`<tr>${head.map((_,i)=>`<td>${(r[i]??'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
  $('out').innerHTML=h;
  if(m&&cat){
    const agg={};cat.vals.forEach((k,i)=>{const v=Number(m.vals[i]);if(isNum(m.vals[i]))agg[k]=(agg[k]||0)+v});
    const e=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
    bars($('c1'),e.map(x=>x[0]),e.map(x=>x[1]));
  }
  if(m&&dates[0]){
    const agg={};dates[0].vals.forEach((k,i)=>{const d=k.slice(0,10);if(isNum(m.vals[i]))agg[d]=(agg[d]||0)+Number(m.vals[i])});
    const e=Object.entries(agg).sort((a,b)=>a[0]<b[0]?-1:1);
    line($('c2'),e.map(x=>x[0]),e.map(x=>x[1]));
  }
}

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;render(await f.text(),f.name)};
async function loadUrl(){
  const u=$('url').value.trim();if(!u)return;
  try{
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();
    if(t!==lastText){lastText=t;render(t,u.split('/').pop().split('?')[0])}
    else $('status').textContent=`No change. Checked ${new Date().toLocaleTimeString()}`;
  }catch(e){$('err').textContent='Could not load URL: '+e.message+' (the host must allow cross-origin requests)'}
}
function schedule(){
  clearInterval(timer);const s=Number($('every').value);
  if(s&&$('url').value.trim())timer=setInterval(loadUrl,s*1000);
}
$('go').onclick=()=>{lastText=null;loadUrl();schedule()};
$('every').onchange=schedule;
const q=new URLSearchParams(location.search).get('csv');
if(q){$('url').value=q;loadUrl();schedule()}
</script>
</body>
</html>
