<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCOR Lab Simulator</title>
<style>
:root{--bg:#070b14;--card:#0f1626;--line:#1e2a44;--tx:#e6edf7;--mut:#8da0c0;--a:#00d4ff;--b:#7c5cff;--g:#22e39b;--r:#ef4444}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2a66 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}
.sp{flex:1}.dim{color:var(--mut)}
button{background:#16213a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit}button:hover{border-color:var(--a)}
button.primary{background:linear-gradient(90deg,var(--a),var(--b));color:#041018;font-weight:700;border:0}button:disabled{opacity:.4;cursor:default}
button.x{padding:0 7px;color:var(--r)}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;padding:14px;height:calc(100% - 52px)}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:linear-gradient(180deg,#111a2e,var(--card));border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px #0006;min-height:0}
#topoCard{flex:0 0 auto}#topo{width:100%;height:auto;display:block}
.lnk{stroke:#3b5a99;stroke-width:2}.lbl{fill:#7f9ccc;font-size:10px}.net{fill:#4a6a9f;font-size:10px}
.node{cursor:pointer}.node:hover rect{fill:#16213a}.ico{font-size:20px}.nm{fill:#cfe3ff;font-size:11px}.xmark{fill:#ef4444;font-size:13px;font-weight:700}
#tasksCard{flex:1;overflow:auto}
.bar0{height:8px;background:#0a1020;border-radius:6px;overflow:hidden;margin:6px 0 8px}.bar0 i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g));width:0;transition:.4s}
.task{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:#0b1222}.task.ok{border-color:#1f6b4a;background:#0b1a18}
.task summary{cursor:pointer}.chk{display:inline-block;width:18px;color:var(--mut)}.task.ok .chk{color:var(--g)}.task p{margin:6px 0;color:var(--mut)}.ans pre{margin:4px 0;background:#070b14;padding:8px;border-radius:8px;color:var(--a);white-space:pre-wrap}
#panelCard{flex:1;display:flex;flex-direction:column;overflow:hidden}#panel{display:flex;flex-direction:column;min-height:0;flex:1}
.dhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}.tag{font-size:11px;padding:2px 8px;border-radius:999px;color:#06101c;font-weight:700}
.tabs,.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tabs button.on,.subnav button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#041018;border:0;font-weight:700}
.body{flex:1;overflow:auto;min-height:0}.subbody{padding-top:4px}
.term{background:#02060d;border:1px solid var(--line);border-radius:10px;height:100%;min-height:300px;display:flex;flex-direction:column;font:12.5px/1.4 ui-monospace,Consolas,monospace;padding:8px}
.tout{flex:1;overflow:auto;white-space:pre-wrap}.res{margin:0;color:#b6e3c8;font:inherit;white-space:pre-wrap}.pr{color:var(--a)}
.trow{display:flex;gap:4px}.tin{flex:1;background:transparent;border:0;outline:0;color:var(--tx);font:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}.tbl th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:4px}.tbl td{padding:4px;border-bottom:1px solid #131d33}
.up{color:var(--g)}.dn{color:var(--r)}.warn{color:#facc15}
.frm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}input,select{background:#0a1020;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit}
h3,h4{margin:8px 0 4px}.deploy{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#0b1222}
.ph{padding:5px 8px;border-left:3px solid var(--line);margin:4px 0;background:#0b1222}.ph.ok{border-color:var(--g)}.ph.drop{border-color:var(--r)}.phr{margin-top:8px;font-weight:700}
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:#111;height:100%;min-height:300px}.browser .bar{display:flex;gap:6px;padding:6px;background:#e5e7eb;align-items:center}.browser .url{flex:1;background:#fff;color:#111;border:1px solid #cbd5e1}.page{padding:20px}.bad{color:#b91c1c}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#12351f;border:1px solid var(--g);padding:8px 16px;border-radius:10px;transition:.3s;opacity:0}#toast.show{transform:translateX(-50%);opacity:1}#toast.bad{background:#3a1218;border-color:var(--r)}
@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}}
</style></head><body>
<header><h1>SCOR Lab Simulator</h1><span class="dim">simulated Cisco-style devices · no images required · CCNP Security 350-701 practice</span><span class="sp"></span><button id="reset">Reset lab</button></header>
<main>
 <div class="col">
  <div class="card" id="topoCard"><svg id="topo" viewBox="30 82 1000 448"></svg><div class="dim" style="font-size:12px">Click a device. Open its Console / GUI. Packets animate across the map when you ping, curl or browse (green = delivered, red = dropped).</div></div>
  <div class="card" id="tasksCard"><b>Lab tasks (auto-graded)</b> <span class="dim" id="progt"></span><div class="bar0"><i id="prog"></i></div><div id="tasks"></div></div>
 </div>
 <div class="col"><div class="card" id="panelCard"><div id="panel"></div></div></div>
</main><div id="toast"></div>
<script src="engine.js"></script><script src="cli.js"></script><script src="app.js"></script>
</body></html>
