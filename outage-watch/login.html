<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>outage-watch · sign in</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--line:#d8d0c1;--ink:#18202b;--muted:#566173;--accent:#0b5cad;--down:#c41c38}
@media (prefers-color-scheme:dark){:root{--bg:#080c12;--panel:#0f151f;--line:#232e3f;--ink:#e9eef5;--muted:#93a2b7;--accent:#74b9ff;--down:#ff5d6e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:24rem;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.2rem;display:grid;gap:.7rem}
h1{margin:0;font:700 1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-weight:600}
input,button{font:inherit;min-height:2.6rem;border-radius:.45rem;border:1px solid var(--line);padding:.4rem .7rem;background:var(--bg);color:var(--ink);width:100%}
button{background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{color:var(--down);font-weight:600;min-height:1.4em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>outage-watch</h1>
  <p>This dashboard is read-protected. Enter the viewer token you were given.</p>
  <label for="t">Viewer token</label>
  <input id="t" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" required>
  <button type="submit">Sign in</button>
  <p id="msg" role="alert"></p>
  <p>The token is sent once to this server and exchanged for a session cookie. It is not stored in the browser or put in the address bar.</p>
</form>
<noscript>Signing in needs JavaScript.</noscript>
<script>
(function(){
'use strict';
var f=document.getElementById('f'),t=document.getElementById('t'),msg=document.getElementById('msg');
f.addEventListener('submit',function(e){
  e.preventDefault();msg.textContent='';
  fetch('login',{method:'POST',cache:'no-store',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.value})})
   .then(function(r){t.value='';
     if(r.ok){location.replace('./');return;}
     msg.textContent=r.status===429?'Too many attempts. Wait a minute and try again.':r.status===401?'That token was not accepted.':'Sign-in is not available ('+r.status+').';})
   .catch(function(){msg.textContent='Could not reach outage-watch.';});
});
t.focus();
})();
</script>
</body>
</html>
